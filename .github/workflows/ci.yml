name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  # Catches dependency-driven MSRV drift ("yesterday it built, today it doesn't,
  # and we didn't change any code"). Pins the declared rust-version and just
  # checks that the whole tree still compiles there.
  msrv:
    name: MSRV (1.82)
    runs-on: ubuntu-latest
    # Don't deny warnings here: an older compiler may lint differently — we only
    # care whether the dependency tree still builds on the declared minimum.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --all-targets
